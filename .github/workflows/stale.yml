name: Close stale issues

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'stale'
          exempt-issue-labels: 'security,bug,pinned'
          exempt-all-milestones: true
          remove-stale-when-updated: true
          stale-issue-message: >
            Thank you for opening this issue! We appreciate your contribution to the project.
            
            This issue has had no activity for the past 30 days and is being marked as stale.
            If this issue is still relevant to you, please leave a comment to let us know.
            Any comment will keep this issue open. Otherwise, it will be automatically closed
            in 14 days.
          close-issue-message: >
            This issue was closed due to inactivity. If you still think this is relevant or
            would like to continue the discussion, feel free to reopen it or file a new issue.
            We're always happy to revisit!
