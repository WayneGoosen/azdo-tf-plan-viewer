name: Docs

# Builds the Material for MkDocs site and deploys it to GitHub Pages.
# Source lives in docs/ + mkdocs.yml. Marketplace screenshots are copied in at
# build time (docs/assets/images is generated, not committed) so there's a
# single source of truth for the images.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'marketplace/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        # Hash-locked and wheels-only: no unverified versions, no sdist setup.py runs.
        # Block scalar because a bare `:all: ` would parse as a YAML mapping.
        run: |
          pip install --only-binary :all: --require-hashes -r docs/requirements.txt

      - name: Stage screenshots into the docs tree
        run: |
          set -e
          mkdir -p docs/assets/images
          cp marketplace/images/*.png docs/assets/images/

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Write scopes only where the deployment happens, not for the whole workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
