name: Docs

# Builds the Material for MkDocs site and deploys it to GitHub Pages.
# Source lives in docs/ + mkdocs.yml. Marketplace screenshots are copied in at
# build time (docs/assets/images is generated, not committed) so there's a
# single source of truth for the images.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'marketplace/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        # Hash-locked and wheels-only: no unverified versions, no sdist setup.py runs.
        # Block scalar because a bare `:all: ` would parse as a YAML mapping.
        run: |
          pip install --only-binary :all: --require-hashes -r docs/requirements.txt

      - name: Stage screenshots into the docs tree
        run: |
          set -e
          mkdir -p docs/assets/images
          cp marketplace/images/*.png docs/assets/images/

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Write scopes only where the deployment happens, not for the whole workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
