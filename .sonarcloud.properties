# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file, not sonar-project.properties (which is only
# used by the CI scanner step in pr.yml once SONAR_TOKEN is set and the project is
# switched to CI-based analysis). Keep the two in sync.

sonar.sources=buildAndReleaseTask,tab,.github,example-pipeline.yml
# Local dev harness, not shipped in the extension.
sonar.exclusions=**/node_modules/**,dist/**,.dev/**,dev-fixtures/**,**/*.js,**/*.js.map
sonar.sourceEncoding=UTF-8
