version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      dev-tooling:
        dependency-type: development
      production:
        dependency-type: production

  - package-ecosystem: npm
    directory: /buildAndReleaseTask
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      dev-tooling:
        dependency-type: development
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github_actions']
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies']
