# SonarCloud configuration.
#
# Free for public repositories. Requires the SONAR_TOKEN secret and CI-based analysis --
# see .github/RELEASING.md. The analysis step in pr.yml skips itself when the token is
# absent, so the `build` check stays green for forks and before setup is complete.

sonar.projectKey=WayneGoosen_azdo-tf-plan-viewer
sonar.organization=waynegoosen-1
sonar.projectName=azdo-tf-plan-viewer

sonar.sources=buildAndReleaseTask,tab,.github,example-pipeline.yml
# Keep in sync with .sonarcloud.properties (used by Automatic Analysis).
sonar.exclusions=**/node_modules/**,dist/**,.dev/**,dev-fixtures/**,**/*.js,**/*.js.map
sonar.sourceEncoding=UTF-8
